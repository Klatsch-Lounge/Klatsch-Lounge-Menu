<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klatsch Lounge Bestellungen</title><link rel="stylesheet" href="../style.css"></head><body><header class="hero"><div><div class="mark">KL</div><h1>BESTELLUNGEN</h1><p>KLATSCH LOUNGE</p></div></header><main class="panel"><section id="login"><h2>Mitarbeiter-Login</h2><form class="form" id="loginForm"><input id="email" type="email" placeholder="Admin-E-Mail" required><input id="password" type="password" placeholder="Passwort" required><button class="btn primary">Anmelden</button></form><p class="small" id="loginMsg"></p></section><section id="board" class="hidden"><div class="ordersTop"><a class="btn" href="../">Menü</a><button class="btn" id="soundBtn">🔔 Ton aktivieren</button><button class="btn" id="refresh">Aktualisieren</button><button class="btn" id="archiveToggle">Archiv</button><button class="btn" id="logout">Abmelden</button></div><h2 id="viewTitle">Aktive Tische</h2><div id="tableGrid" class="tableGrid"></div><div id="tableDetails" class="tableDetails"></div><div id="archiveList" class="hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../app.js"></script><script>
const $=s=>document.querySelector(s),login=$('#login'),board=$('#board'),msg=$('#loginMsg');let channel,allOrders=[],selectedTable=null,soundEnabled=false,showArchive=false,lastSeenId=0,audioCtx;
function beep(){if(!soundEnabled)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const n=audioCtx.currentTime;[0,.18].forEach((d,k)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=k?960:760;g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.22,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+.16);o.connect(g).connect(audioCtx.destination);o.start(n+d);o.stop(n+d+.18)})}
$('#soundBtn').onclick=async()=>{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();soundEnabled=!soundEnabled;$('#soundBtn').textContent=soundEnabled?'🔔 Ton aktiv':'🔕 Ton aus';$('#soundBtn').classList.toggle('soundOn',soundEnabled);if(soundEnabled)beep()};
async function loadOrders(){const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300);if(error){$('#tableGrid').innerHTML='<p>Fehler: '+esc(error.message)+'</p>';return}allOrders=data||[];lastSeenId=Math.max(lastSeenId,...allOrders.map(o=>+o.id||0));draw()}
const activeGroups=()=>{const m=new Map();allOrders.filter(o=>!o.archived_at).forEach(o=>(m.get(o.table_no)||m.set(o.table_no,[]).get(o.table_no)).push(o));return[...m.entries()].sort((a,b)=>a[0]-b[0])},sum=os=>os.reduce((a,o)=>a+Number(o.total||0),0);
function draw(){if(showArchive)return drawArchive();$('#viewTitle').textContent='Aktive Tische';$('#archiveList').classList.add('hidden');$('#tableGrid').classList.remove('hidden');const gs=activeGroups();$('#tableGrid').innerHTML=gs.map(([t,os])=>`<button class="tableTile ${os.some(o=>o.status==='Neu')?'newTable':''}" data-table="${t}"><strong>Tisch ${t}</strong><span>${os.length} Bestellung${os.length===1?'':'en'} · ${sum(os).toFixed(2).replace('.',',')} €</span></button>`).join('')||'<p class="status">Keine aktiven Tische.</p>';if(selectedTable&&!gs.some(([t])=>t===selectedTable))selectedTable=null;drawTable()}
$('#tableGrid').onclick=e=>{const b=e.target.closest('[data-table]');if(!b)return;selectedTable=+b.dataset.table;drawTable();$('#tableDetails').scrollIntoView({behavior:'smooth'})};
function drawTable(){const box=$('#tableDetails');if(!selectedTable)return box.innerHTML='';const os=allOrders.filter(o=>!o.archived_at&&o.table_no===selectedTable).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(!os.length)return box.innerHTML='';box.innerHTML=`<section class="card"><div class="tableHead"><h2>Tisch ${selectedTable}</h2><div class="actions"><button class="btn" id="changeTable">Tischnummer ändern</button><button class="btn primary" id="archiveTable">Tisch fertig / archivieren</button></div></div>${os.map(o=>`<div class="card ${o.status==='Neu'?'orderNew':''}"><div class="cardline"><strong>Bestellung #${o.id}</strong><span class="badge">${esc(o.status)}</span></div><div class="small">${new Date(o.created_at).toLocaleString('de-DE')}${o.guest_name?' · '+esc(o.guest_name):''}</div>${o.items.map(i=>`<div class="cardline"><span>${i.qty} × ${esc(i.name)}</span><span>${esc(i.price)}</span></div>`).join('')}<p><strong>${Number(o.total).toFixed(2).replace('.',',')} €</strong></p>${o.note?`<p class="small">Bemerkung: ${esc(o.note)}</p>`:''}<select class="status" data-id="${o.id}">${['Neu','Angenommen','In Zubereitung','Bereit','Serviert','Storniert'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}<p><strong>Tischsumme: ${sum(os).toFixed(2).replace('.',',')} €</strong></p></section>`;$('#changeTable').onclick=changeTable;$('#archiveTable').onclick=archiveTable}
async function changeTable(){const old=selectedTable,n=Number(prompt('Neue Nummer für alle aktiven Bestellungen von Tisch '+old+':',old));if(!Number.isInteger(n)||n<1||n>999)return alert('Ungültige Tischnummer.');const{error}=await sb.from('orders').update({table_no:n}).eq('table_no',old).is('archived_at',null);if(error)return alert(error.message);selectedTable=n;loadOrders()}
async function archiveTable(){if(!confirm('Tisch '+selectedTable+' abschließen und archivieren?'))return;const{error}=await sb.from('orders').update({archived_at:new Date().toISOString()}).eq('table_no',selectedTable).is('archived_at',null);if(error)return alert(error.message);selectedTable=null;loadOrders()}
$('#tableDetails').onchange=async e=>{if(!e.target.matches('select[data-id]'))return;const{error}=await sb.from('orders').update({status:e.target.value}).eq('id',e.target.dataset.id);if(error)alert(error.message);else loadOrders()};
function drawArchive(){$('#viewTitle').textContent='Archivierte Bestellungen';$('#tableGrid').classList.add('hidden');$('#tableDetails').innerHTML='';$('#archiveList').classList.remove('hidden');const a=allOrders.filter(o=>o.archived_at);$('#archiveList').innerHTML=a.map(o=>`<section class="card"><h3>Tisch ${o.table_no} · #${o.id}</h3><p class="small">Archiviert: ${new Date(o.archived_at).toLocaleString('de-DE')}</p>${o.items.map(i=>`<div class="cardline"><span>${i.qty} × ${esc(i.name)}</span><span>${esc(i.price)}</span></div>`).join('')}<p><strong>${Number(o.total).toFixed(2).replace('.',',')} €</strong></p></section>`).join('')||'<p class="status">Archiv ist leer.</p>'}
$('#archiveToggle').onclick=()=>{showArchive=!showArchive;$('#archiveToggle').textContent=showArchive?'Aktive Tische':'Archiv';draw()};
async function openBoard(){login.classList.add('hidden');board.classList.remove('hidden');await loadOrders();channel=sb.channel('orders-board-v2').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>{if(+p.new.id>lastSeenId){lastSeenId=+p.new.id;beep()}loadOrders()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},loadOrders).subscribe()}
async function boot(){if(!ready)return msg.textContent='Keine Supabase-Konfiguration.';const{data:{session}}=await sb.auth.getSession();if(session)openBoard()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)msg.textContent='Anmeldung fehlgeschlagen.';else openBoard()};$('#logout').onclick=async()=>{if(channel)await sb.removeChannel(channel);await sb.auth.signOut();location.reload()};$('#refresh').onclick=loadOrders;boot();
</script></body></html>
