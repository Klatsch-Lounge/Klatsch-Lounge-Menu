<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klatsch Lounge Bestellungen</title><link rel="stylesheet" href="../style.css"></head><body><header class="hero"><div><div class="mark">KL</div><h1>BESTELLUNGEN</h1><p>KLATSCH LOUNGE</p></div></header><main class="panel"><section id="login"><h2>Mitarbeiter-Login</h2><form class="form" id="loginForm"><input id="email" type="email" placeholder="Admin-E-Mail" required><input id="password" type="password" placeholder="Passwort" required><button class="btn primary">Anmelden</button></form><p class="small" id="loginMsg"></p></section><section id="board" class="hidden"><div class="ordersTop"><a class="btn" href="../">Menü</a><button class="btn" id="refresh">Aktualisieren</button><button class="btn" id="logout">Abmelden</button></div><div id="orders"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../app.js"></script><script>
const login=document.querySelector('#login'),board=document.querySelector('#board'),msg=document.querySelector('#loginMsg');let channel;
async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){orders.innerHTML='<p class="small">Fehler: '+esc(error.message)+'</p>';return}orders.innerHTML=data.map(o=>`<section class="card ${o.status==='Neu'?'orderNew':''}"><div class="cardline"><strong>Tisch ${o.table_no}</strong><span class="badge">${esc(o.status)}</span></div><div class="small">${new Date(o.created_at).toLocaleString('de-DE')}${o.guest_name?' · '+esc(o.guest_name):''}</div>${o.items.map(i=>`<div class="cardline"><span>${i.qty} × ${esc(i.name)}</span><span>${esc(i.price)}</span></div>`).join('')}<p><strong>Gesamt: ${Number(o.total).toFixed(2).replace('.',',')} €</strong></p>${o.note?`<p class="small">Bemerkung: ${esc(o.note)}</p>`:''}<select class="status" data-id="${o.id}">${['Neu','Angenommen','In Zubereitung','Bereit','Serviert','Storniert'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></section>`).join('')||'<p class="status">Noch keine Bestellungen.</p>'}
async function openBoard(){login.classList.add('hidden');board.classList.remove('hidden');await loadOrders();channel=sb.channel('orders-board').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe()}
async function boot(){if(!ready){msg.textContent='Keine Supabase-Konfiguration gefunden.';return}const {data:{session}}=await sb.auth.getSession();if(session)openBoard()}
loginForm.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent='Anmeldung fehlgeschlagen.';else openBoard()};logout.onclick=async()=>{if(channel)await sb.removeChannel(channel);await sb.auth.signOut();location.reload()};refresh.onclick=loadOrders;orders.onchange=async e=>{if(!e.target.matches('select[data-id]'))return;const {error}=await sb.from('orders').update({status:e.target.value}).eq('id',e.target.dataset.id);if(error)alert(error.message);else loadOrders()};boot();
</script></body></html>
