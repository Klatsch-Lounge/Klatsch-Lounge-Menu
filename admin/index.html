<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klatsch Lounge Admin</title><link rel="stylesheet" href="../style.css"></head><body><header class="hero"><div><div class="mark">KL</div><h1>ADMIN</h1><p>KLATSCH LOUNGE</p></div></header><main class="panel"><section id="login"><h2>Anmelden</h2><form class="form" id="loginForm"><input id="email" type="email" placeholder="Admin-E-Mail" required><input id="password" type="password" placeholder="Passwort" required><button class="btn primary">Anmelden</button></form><p class="small" id="loginMsg"></p></section><section id="editor" class="hidden"><div class="actions"><a class="btn" href="../index.html">Öffentliche Karte</a><button class="btn" id="logout">Abmelden</button></div><h2>Produkt bearbeiten</h2><form class="form" id="itemForm"><select id="category"></select><input id="name" placeholder="Produktname" required><input id="description" placeholder="Beschreibung"><div class="row"><input id="price" placeholder="Preis" required><button class="btn primary">Hinzufügen</button></div></form><div id="list"></div><p class="small" id="saveMsg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../app.js"></script><script>
let menu;
const login=document.querySelector('#login'),editor=document.querySelector('#editor'),msg=document.querySelector('#loginMsg');
async function boot(){if(!ready){msg.textContent='Bitte zuerst config.js mit den Supabase-Daten ausfüllen.';return}const {data:{session}}=await sb.auth.getSession();if(session)openEditor()}
async function openEditor(){menu=await loadMenu();login.classList.add('hidden');editor.classList.remove('hidden');draw()}
loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Anmeldung läuft …';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='Anmeldung fehlgeschlagen: '+error.message}else openEditor()};
logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
function draw(){category.innerHTML=menu.categories.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('');list.innerHTML=menu.categories.map((c,ci)=>`<section class="card"><h3>${esc(c.name)}</h3>${c.items.map((i,ii)=>`<div class="cardline"><span>${esc(i[0])} · ${esc(i[2])}</span><span><button class="btn" data-edit="${ci},${ii}">Ändern</button> <button class="btn" data-del="${ci},${ii}">×</button></span></div>`).join('')}</section>`).join('')}
async function save(){saveMsg.textContent='Speichern …';const {error}=await sb.from('menu_data').update({content:menu,updated_at:new Date().toISOString()}).eq('id',1);saveMsg.textContent=error?'Fehler: '+error.message:'Gespeichert. Die öffentliche Karte ist aktualisiert.'}
itemForm.onsubmit=async e=>{e.preventDefault();menu.categories[+category.value].items.push([name.value.trim(),description.value.trim(),price.value.trim()]);itemForm.reset();draw();await save()};
list.onclick=async e=>{let v=e.target.dataset.del;if(v){const[ci,ii]=v.split(',').map(Number);if(confirm('Produkt löschen?')){menu.categories[ci].items.splice(ii,1);draw();await save()}return}v=e.target.dataset.edit;if(v){const[ci,ii]=v.split(',').map(Number),i=menu.categories[ci].items[ii];const n=prompt('Produktname',i[0]);if(n===null)return;const d=prompt('Beschreibung',i[1]);if(d===null)return;const p=prompt('Preis',i[2]);if(p===null)return;menu.categories[ci].items[ii]=[n.trim(),d.trim(),p.trim()];draw();await save()}};boot();
</script></body></html>
