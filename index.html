<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><title>Klatsch Lounge Menü & Bestellung</title><link rel="stylesheet" href="style.css"></head><body class="hasCart"><header class="hero"><div><div class="mark" id="mark">KL</div><h1 id="brand">KLATSCH</h1><p id="sub">LOUNGE</p><small id="note"></small></div></header><nav class="nav" id="nav"></nav><main class="content" id="menu"><p class="status">Menü wird geladen …</p></main><div class="cartbar"><span class="cartCount" id="cartCount">0</span><button class="btn primary" id="openCart">Warenkorb / Bestellen</button></div><div class="cartModal hidden" id="cartModal"><section class="cartBox"><div class="actions"><button class="btn" id="closeCart">Zurück</button></div><h2>Deine Bestellung</h2><div id="cartItems"></div><p><strong>Gesamt: <span id="cartTotal">0,00 €</span></strong></p><form class="form" id="orderForm"><input id="tableNo" type="number" min="1" max="999" inputmode="numeric" placeholder="Tischnummer" required><input id="guestName" maxlength="60" placeholder="Name (optional)"><textarea id="orderNote" maxlength="300" placeholder="Bemerkung (optional)"></textarea><button class="btn primary" type="submit">Bestellung absenden</button></form><p class="small" id="orderMsg"></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
let currentMenu,cart=[];const money=v=>Number(String(v).replace('€','').replace(',','.').trim())||0;const eur=n=>n.toFixed(2).replace('.',',')+' €';
function renderOrdering(m){currentMenu=m;renderMenu(m);document.querySelectorAll('.item').forEach((el)=>{const b=document.createElement('button');b.className='orderBtn';b.textContent='+ Hinzufügen';const section=el.closest('.category'),catId=section.id,name=el.querySelector('h3').textContent,price=el.querySelector('.price').textContent;b.onclick=()=>add(catId,name,price);el.appendChild(b)})}
function add(cat,name,price){const x=cart.find(i=>i.name===name&&i.price===price);if(x)x.qty++;else cart.push({cat,name,price,qty:1});drawCart()}
function drawCart(){cartCount.textContent=cart.reduce((a,i)=>a+i.qty,0);cartItems.innerHTML=cart.length?cart.map((i,n)=>`<div class="cartLine"><div><strong>${esc(i.name)}</strong><br><span class="small">${esc(i.price)}</span></div><div class="qty"><button data-n="${n}" data-d="-1">−</button><b>${i.qty}</b><button data-n="${n}" data-d="1">+</button></div></div>`).join(''):'<p class="small">Der Warenkorb ist leer.</p>';cartTotal.textContent=eur(cart.reduce((a,i)=>a+money(i.price)*i.qty,0))}
cartItems.onclick=e=>{const b=e.target.closest('button[data-n]');if(!b)return;const n=+b.dataset.n;cart[n].qty+=+b.dataset.d;if(cart[n].qty<=0)cart.splice(n,1);drawCart()};openCart.onclick=()=>{drawCart();cartModal.classList.remove('hidden')};closeCart.onclick=()=>cartModal.classList.add('hidden');
orderForm.onsubmit=async e=>{e.preventDefault();if(!cart.length){orderMsg.textContent='Bitte zuerst Produkte auswählen.';return}if(!ready){orderMsg.textContent='Keine Datenbankverbindung.';return}orderMsg.textContent='Bestellung wird gesendet …';const payload=cart.map(i=>({name:i.name,price:i.price,qty:i.qty}));const total=cart.reduce((a,i)=>a+money(i.price)*i.qty,0);const {error}=await sb.rpc('place_order',{p_table_no:+tableNo.value,p_guest_name:guestName.value.trim()||null,p_note:orderNote.value.trim()||null,p_items:payload,p_total:total});if(error){orderMsg.textContent='Fehler: '+error.message;return}cart=[];drawCart();orderForm.reset();orderMsg.textContent='';cartModal.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});};
loadMenu().then(renderOrdering).catch(()=>renderOrdering(seed));
</script></body></html>
